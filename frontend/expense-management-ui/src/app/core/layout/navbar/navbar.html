<mat-toolbar>
    <button mat-icon-button class="burger-btn" (click)="sidenavService.toggle()" aria-label="Toggle navigation menu">
        <mat-icon>menu</mat-icon>
    </button>
    <span>Expense Management</span>

    <span class="spacer"></span>

    <button mat-icon-button (click)="themeService.toggleTheme()">
        
        <mat-icon>
            {{ themeService.darkMode() ? 'light_mode' : 'dark_mode'}}
        </mat-icon>

    </button>

    <button mat-button [mat-menu-trigger-for]="userMenu" >
        {{ authService.user()?.role }} | {{ authService.user()?.email }}
        <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
            Logout
        </button>
    </mat-menu>

</mat-toolbar>
