<!-- Toolbar -->
<div class="toolbar-row">
    <div class="search-box-container">
      <mat-form-field appearance="outline">
        <mat-label>Search</mat-label>
        <input 
          matInput
          (keyup)="applyFilter($event)"
          placeholder="Search Category"
        >
      </mat-form-field>
    </div>
