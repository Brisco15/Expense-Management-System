name: Deploy Backend to Azure App Service

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish backend/ExpenseManagement.API/ExpenseManagement.API/ExpenseManagement.API.csproj -c Release -o ./publish

      - name: Zip publish output
        run: cd publish && zip -r ../deploy.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --resource-group ExpenseManagementRG \
            --name expensemgmt-api \
            --src-path deploy.zip \
            --type zip
